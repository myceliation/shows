# Runs entirely on GitHub. Reads coolshows.life (including its archive tabs) and the
# venue calendars in data/sources.json, cleans the listings, places new venues on the
# map, saves everything to data/, rebuilds the site and deploys it to GitHub Pages.
# The page also re-reads the coolshows sheet on every visit for same-day changes.
name: Refresh shows

on:
  schedule:
    - cron: "17 9 * * *"      # every day, ~5am Eastern (GitHub may run it a bit late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-shows
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read all sources
        run: python3 -I tools/scrape.py data || echo "::warning::coolshows could not be read; deploying the last saved data"

      - name: Save the archive back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -q -m "Refresh shows $(date -u +%F)"; git pull -q --rebase && git push -q; }

      - name: Build the page
        run: |
          mkdir -p site
          python3 -I tools/build.py tools/template.html tools/leaflet.css data/shows.json data/basemap.json site
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
