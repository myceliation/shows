# Runs entirely on GitHub: rescrapes coolshows, looks up new venues, keeps past
# shows in data/, rebuilds the page and deploys it to GitHub Pages.
# The page also reads the live sheet on every visit, so this mainly maintains
# the archive and exact venue spots.
name: Refresh shows

on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mon + Thu, ~9am Eastern (GitHub may run it a bit late)
  push:
    branches: [main]
  workflow_dispatch:          # "Run workflow" button on the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-shows
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scrape coolshows.life
        run: python3 -I tools/scrape.py data || echo "::warning::Scrape failed; deploying the last saved data"

      - name: Save the archive back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "Refresh shows $(date -u +%F)"; git push; }

      - name: Build the page
        run: |
          mkdir -p site
          python3 -I tools/build.py tools/template.html tools/leaflet.css data/shows.json data/basemap.json site/index.html
          cp data/shows.json site/shows.json
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
