<title>Coolshows Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>/*__LEAFLET_CSS__*/</style>
<style>
/* Layout: one-screen app on desktop — controls strip over a map with a calendar+list rail; stacks on phones.
   Look: risograph flier on cool newsprint — ink, fluorescent pink, and a hot→cold distance ramp. */
:root {
  --paper: #e8eaee; --panel: #f6f7f9; --ink: #16171c; --ink-2: #4b4f5a; --ink-3: #7c818d;
  --rule: #c9cdd5; --accent: #d4146f; --accent-ink: #ffffff; --focus: #2a5bd7;
  --land: #f3f4f6; --land-far: #dde0e5; --border: #6f7480; --county: #c6cad2; --water: #cfd6df;
  --r0: #d4146f; --r1: #e8542f; --r2: #e39a12; --r3: #3f9a8f; --r4: #4f72b5; --r5: #a2a8b4;
  --nj: #d4146f; --ny: #2f6fd0; --pa: #d98a07;
  --f-display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --s-1: 0.75rem; --s0: 0.875rem; --s1: 1rem; --s2: 1.25rem; --s3: 1.75rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101115; --panel: #17191e; --ink: #ebecef; --ink-2: #b2b6c0; --ink-3: #80858f;
  --rule: #2d3038; --accent: #ff4a9b; --accent-ink: #16171c; --focus: #8fb0ff;
  --land: #1d2026; --land-far: #15171b; --border: #8a909c; --county: #2e323a; --water: #0c0d10;
  --r0: #ff4a9b; --r1: #ff7a4f; --r2: #f2b33a; --r3: #4fc2b3; --r4: #7d9ee6; --r5: #5d626d;
  --nj: #ff4a9b; --ny: #6c9cf0; --pa: #f2b33a; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #101115; --panel: #17191e; --ink: #ebecef; --ink-2: #b2b6c0; --ink-3: #80858f;
  --rule: #2d3038; --accent: #ff4a9b; --accent-ink: #16171c; --focus: #8fb0ff;
  --land: #1d2026; --land-far: #15171b; --border: #8a909c; --county: #2e323a; --water: #0c0d10;
  --r0: #ff4a9b; --r1: #ff7a4f; --r2: #f2b33a; --r3: #4fc2b3; --r4: #7d9ee6; --r5: #5d626d;
  --nj: #ff4a9b; --ny: #6c9cf0; --pa: #f2b33a; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--s0); line-height: 1.45; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
a { color: inherit; }

.app { height: 100%; display: grid; grid-template-rows: auto auto 1fr; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; gap: 10px; }
header.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header.top h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s3); line-height: 1; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
header.top h1 span { color: var(--accent); }
.src { color: var(--ink-2); font-size: var(--s-1); flex: 1 1 280px; min-width: 0; }
.src a { color: var(--ink); }
.stat { font-family: var(--f-mono); font-size: var(--s-1); color: var(--ink-2); font-variant-numeric: tabular-nums; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); padding-block: 8px; }
.ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ctl > .lab { font-size: var(--s-1); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); font-weight: 700; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 4px 9px; cursor: pointer; font-size: var(--s-1); font-weight: 700; }
.seg button + button { border-left: 1.5px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
select, input[type="search"] { background: var(--panel); border: 1.5px solid var(--rule); border-radius: 3px; padding: 4px 6px; font-size: var(--s-1); max-width: 100%; }
input[type="search"] { width: 170px; }
.chk { display: inline-flex; align-items: center; gap: 4px; font-size: var(--s-1); cursor: pointer; }
.chk input { accent-color: var(--accent); }
.btn { background: transparent; border: 1.5px solid var(--ink); border-radius: 3px; padding: 4px 9px; cursor: pointer; font-size: var(--s-1); font-weight: 700; }
.btn.hot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: 0.45; cursor: default; }

main.stage { display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 12px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; border: 1.5px solid var(--ink); border-radius: 3px; overflow: hidden; background: var(--water); }
#map { position: absolute; inset: 0; background: var(--water); }
.legend { position: absolute; left: 10px; bottom: 10px; z-index: 500; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 3px; padding: 6px 8px; font-size: var(--s-1); display: grid; gap: 4px; max-width: calc(100% - 20px); }
.legend .t { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.68rem; color: var(--ink-2); }
.legend .row { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend .k { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 0.7rem; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; border: 1px solid var(--ink); }
.sw.approx { border-style: dashed; background: transparent !important; }
.pickhint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 600; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 5px 12px; border-radius: 3px; font-size: var(--s-1); }

.rail { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; min-height: 0; min-width: 0; }
.cal { background: var(--panel); border: 1.5px solid var(--ink); border-radius: 3px; padding: 8px; }
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.calhead h2 { font-family: var(--f-display); font-weight: 400; font-size: var(--s1); margin: 0; letter-spacing: 0.01em; }
.calhead button { background: transparent; border: 1.5px solid var(--rule); border-radius: 3px; width: 28px; height: 26px; cursor: pointer; font-weight: 700; }
.grid7 { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.dow { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); text-align: center; font-weight: 700; }
.day { position: relative; min-height: 46px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper); padding: 2px 3px; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; }
.day.out { opacity: 0.35; }
.day .n { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 500; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; }
.day .n b { font-weight: 600; color: var(--ink-2); font-size: 0.66rem; }
.day.today .n span { color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.day.inwin { background: var(--land); border-color: var(--ink-3); }
.day.sel { outline: 2.5px solid var(--ink); outline-offset: -1px; }
.day.past .n span { color: var(--ink-3); }
.dots { display: flex; flex-wrap: wrap; gap: 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.calfoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: var(--s-1); color: var(--ink-2); flex-wrap: wrap; }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--ink); }
.tabs button { background: transparent; border: 0; padding: 6px 12px; font-weight: 700; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; font-size: var(--s0); }
.tabs button[aria-selected="true"] { border-bottom-color: var(--accent); }
.tabs .count { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); margin-left: 4px; }
.pane { overflow-y: auto; min-height: 0; padding-right: 2px; }

.dgroup + .dgroup { margin-top: 12px; }
.dhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; position: sticky; top: 0; background: var(--paper); padding-block: 4px; z-index: 2; border-bottom: 1px solid var(--rule); }
.dhead h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: var(--s1); }
.dhead .rel { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); }
.show { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px dashed var(--rule); align-items: start; }
.show .sw { margin-top: 5px; }
.show .bands { font-weight: 700; line-height: 1.3; cursor: pointer; }
.show .bands:hover { text-decoration: underline; }
.meta { color: var(--ink-2); font-size: var(--s-1); display: flex; flex-wrap: wrap; gap: 2px 8px; margin-top: 2px; }
.meta .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--ink-3); border-radius: 2px; padding: 0 4px; color: var(--ink-2); }
.tag.free { border-color: var(--r3); color: var(--r3); }
.tag.aa { border-color: var(--ink); color: var(--ink); }
.links { display: flex; gap: 8px; font-size: var(--s-1); margin-top: 3px; }
.star { background: transparent; border: 1.5px solid var(--ink); border-radius: 3px; cursor: pointer; font-size: var(--s-1); font-weight: 700; padding: 2px 7px; white-space: nowrap; }
.star[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.empty { color: var(--ink-2); padding: 14px 2px; }
.empty b { color: var(--ink); }

.plan .leg { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); padding: 2px 0 2px 22px; border-left: 2px dotted var(--ink-3); margin-left: 5px; }
.plan .warn { color: var(--accent); font-weight: 700; }
.plansum { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--rule); }
.plansum .tot { font-family: var(--f-mono); font-size: var(--s-1); margin-right: auto; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 3px; z-index: 2000; font-weight: 700; font-size: var(--s-1); }

/* map bits */
.leaflet-container { font-family: var(--f-body); background: var(--water); }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: var(--panel); color: var(--ink); border-radius: 3px; box-shadow: 0 2px 0 var(--ink); border: 1.5px solid var(--ink); }
.leaflet-popup-content { margin: 10px 12px; font-size: var(--s-1); width: 260px !important; max-width: 70vw; }
.leaflet-container a.leaflet-popup-close-button { color: var(--ink-2); }
.leaflet-bar a, .leaflet-bar a:hover { background: var(--panel); color: var(--ink); border-bottom-color: var(--rule); }
.leaflet-bar { border: 1.5px solid var(--ink) !important; }
.leaflet-control-attribution { background: var(--panel) !important; color: var(--ink-2) !important; font-size: 0.62rem; }
.pop h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: var(--s1); line-height: 1.15; }
.pop .sub { color: var(--ink-2); margin: 2px 0 6px; }
.pop .ps { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 8px; padding: 5px 0; border-top: 1px dashed var(--rule); align-items: start; }
.pop .ps .d { font-family: var(--f-mono); font-size: 0.7rem; color: var(--ink-2); }
.pop .ps.dim { opacity: 0.5; }
.pop .acts { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.citylab { font-family: var(--f-mono); font-size: 0.66rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; text-shadow: 0 0 3px var(--land), 0 0 3px var(--land); pointer-events: none; }
.citylab.big { font-size: 0.74rem; color: var(--ink); }
.origin-pin { width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--paper); }
.ringlab { font-family: var(--f-mono); font-size: 0.62rem; color: var(--ink-2); white-space: nowrap; pointer-events: none; text-shadow: 0 0 3px var(--land), 0 0 3px var(--land); }

@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto; }
  main.stage { grid-template-columns: minmax(0, 1fr); }
  .mapwrap { height: 62vh; min-height: 340px; }
  .rail { grid-template-rows: auto; }
  .pane { overflow: visible; }
  input[type="search"] { width: 140px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="top">
    <h1>Coolshows <span>Atlas</span></h1>
    <p class="src">DIY shows across NJ, NY and PA, mapped from the calendar at <a href="https://coolshows.life/" target="_blank" rel="noopener">coolshows.life</a>. <span id="scraped"></span>. Know a show that's missing? <a href="https://docs.google.com/forms/d/e/1FAIpQLSeENHJJNiIKnaRZvx4sDGcTFX6e2BoymIY1XrXe9YuDyB_tUg/viewform" target="_blank" rel="noopener">Submit it to coolshows</a>.</p>
    <span class="stat" id="stat"></span>
  </header>

  <div class="controls" role="toolbar" aria-label="Filters and coloring">
    <div class="ctl"><span class="lab">Color by</span>
      <div class="seg" id="colorBy">
        <button type="button" data-v="days" aria-pressed="true">Days from date</button>
        <button type="button" data-v="miles" aria-pressed="false">Miles from start</button>
        <button type="button" data-v="state" aria-pressed="false">State</button>
      </div>
    </div>
    <div class="ctl"><span class="lab">Show</span>
      <div class="seg" id="win">
        <button type="button" data-v="day" aria-pressed="false">That day</button>
        <button type="button" data-v="3" aria-pressed="false">±3 days</button>
        <button type="button" data-v="week" aria-pressed="true">Week ahead</button>
        <button type="button" data-v="all" aria-pressed="false">All</button>
      </div>
    </div>
    <div class="ctl"><label class="lab" for="origin">Start from</label>
      <select id="origin"></select>
      <button type="button" class="btn" id="pick">Pick on map</button>
    </div>
    <div class="ctl"><label class="lab" for="maxmi">Within</label>
      <select id="maxmi"><option value="">any distance</option><option value="10">10 mi</option><option value="25">25 mi</option><option value="50">50 mi</option><option value="100">100 mi</option></select>
    </div>
    <div class="ctl"><label class="lab" for="age">Age</label>
      <select id="age"><option value="">any</option><option value="aa">all ages only</option><option value="u21">under-21 friendly</option></select>
    </div>
    <div class="ctl"><label class="lab" for="price">Door</label>
      <select id="price"><option value="">any</option><option value="0">free only</option><option value="10">≤ $10</option><option value="15">≤ $15</option><option value="20">≤ $20</option></select>
    </div>
    <div class="ctl" id="states">
      <label class="chk"><input type="checkbox" id="st-NJ" value="NJ" checked> NJ</label>
      <label class="chk"><input type="checkbox" id="st-NY" value="NY" checked> NY</label>
      <label class="chk"><input type="checkbox" id="st-PA" value="PA" checked> PA</label>
      <label class="chk"><input type="checkbox" id="past"> past shows</label>
    </div>
    <div class="ctl"><input type="search" id="q" placeholder="Band, venue, city…" aria-label="Search bands, venues and cities"></div>
  </div>

  <main class="stage">
    <div class="mapwrap">
      <div id="map" aria-label="Map of show venues"></div>
      <div class="legend" id="legend"></div>
      <div class="pickhint" id="pickhint" hidden>Click the map to set your starting point</div>
    </div>
    <aside class="rail">
      <section class="cal" aria-label="Calendar">
        <div class="calhead">
          <button type="button" id="prevM" aria-label="Previous month">‹</button>
          <h2 id="mlabel"></h2>
          <button type="button" id="nextM" aria-label="Next month">›</button>
        </div>
        <div class="grid7" id="dows"></div>
        <div class="grid7" id="days" style="margin-top:3px"></div>
        <div class="calfoot"><span id="selinfo"></span><button type="button" class="btn" id="goToday">Today</button></div>
      </section>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-list" aria-selected="true">Shows<span class="count" id="c-list"></span></button>
        <button type="button" role="tab" id="tab-plan" aria-selected="false">My plan<span class="count" id="c-plan"></span></button>
      </div>
      <div class="pane" id="pane-list" role="tabpanel" aria-labelledby="tab-list"></div>
      <div class="pane plan" id="pane-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></div>
    </aside>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let DATA = /*__DATA__*/null;
const BASE = /*__BASE__*/null;

// ---------- utils ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dn = iso => { const [y,m,d] = iso.split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const isoOf = n => new Date(n*864e5).toISOString().slice(0,10);
const localToday = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDay = iso => { const d = new Date(dn(iso)*864e5); return `${WD[d.getUTCDay()]} ${MO[d.getUTCMonth()].slice(0,3)} ${d.getUTCDate()}`; };
const fmtTime = m => m == null ? "" : `${((Math.floor(m/60)+11)%12)+1}${m%60 ? ":"+String(m%60).padStart(2,"0") : ""}${m >= 720 ? "pm" : "am"}`;
const miles = (a, b) => { const R = 3958.8, r = Math.PI/180; const dLat = (b[0]-a[0])*r, dLng = (b[1]-a[1])*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); };
const store = { get(k, d) { try { const v = localStorage.getItem("csatlas:"+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("csatlas:"+k, JSON.stringify(v)); } catch {} } };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 1800); }
const tok = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- data prep ----------
const TODAY = localToday(), TODAYN = dn(TODAY);
let venues, shows, showById, cityCenters;
function prep(data) {
venues = new Map(data.venues.map(v => [v.key, {...v}]));
// City-level (approximate) venues fan out in rings around the city center so they don't stack.
const byCity = {};
for (const v of venues.values()) if (v.precision === "city" && v.lat != null) (byCity[v.state+v.city] ||= []).push(v);
for (const list of Object.values(byCity)) {
  list.sort((a,b) => a.venue.localeCompare(b.venue));
  list.forEach((v, i) => { const ring = Math.floor(i/8), k = i%8, n = Math.min(8, list.length - ring*8);
    const r = 0.010 * (1 + ring*0.7), a = (k/n)*2*Math.PI + ring*0.4;
    v.cLat = v.lat; v.cLng = v.lng;
    if (list.length > 1) { v.lat += r*Math.sin(a); v.lng += r*Math.cos(a)/Math.cos(v.lat*Math.PI/180); } });
}
shows = data.shows.map(s => ({...s, n: dn(s.date), v: venues.get(s.vkey) || {key: s.vkey, venue: s.venue, city: s.city, state: s.state, lat: null, lng: null, precision: "none"}}));
showById = new Map(shows.map(s => [s.id, s]));
cityCenters = (() => { const m = new Map();
  for (const v of venues.values()) { if (v.lat == null || !v.city) continue; const k = `${v.city}, ${v.state}`;
    const lat = v.cLat ?? v.lat, lng = v.cLng ?? v.lng; if (!m.has(k) || v.precision === "city") m.set(k, {label: k, lat, lng, n: 0}); }
  for (const s of shows) { const k = `${s.city}, ${s.state}`; if (m.has(k)) m.get(k).n++; }
  return [...m.values()].sort((a,b) => a.label.localeCompare(b.label)); })();
}
prep(DATA);

// ---------- state ----------
const firstUpcoming = shows.find(s => s.n >= TODAYN);
const st = {
  sel: TODAY, month: TODAY.slice(0,7), colorBy: "days", win: "week",
  origin: store.get("origin", null), maxMi: null, age: "", price: "", states: new Set(["NJ","NY","PA"]),
  past: false, q: "", plan: new Set(store.get("plan", [])), tab: "list", picking: false,
};
if (!firstUpcoming) st.past = true;

// ---------- coloring ----------
const BUCKETS = {
  days: { title: "Days from selected date", stops: [[0,"same day"],[1,"±1"],[3,"±2–3"],[7,"±4–7"],[14,"±8–14"],[Infinity,"15+"]] },
  miles: { title: "Miles from start (straight line)", stops: [[5,"<5"],[15,"5–15"],[30,"15–30"],[60,"30–60"],[100,"60–100"],[Infinity,"100+"]] },
};
const showMiles = s => (st.origin && s.v.lat != null) ? miles([st.origin.lat, st.origin.lng], [s.v.cLat ?? s.v.lat, s.v.cLng ?? s.v.lng]) : null;
function metric(s) {
  if (st.colorBy === "days") return Math.abs(s.n - dn(st.sel));
  if (st.colorBy === "miles") return showMiles(s);
  return null;
}
function bucketOf(val) { const stops = BUCKETS[st.colorBy].stops; for (let i = 0; i < stops.length; i++) if (val <= stops[i][0]) return i; return stops.length-1; }
function colorOf(s) {
  if (st.colorBy === "state" || (st.colorBy === "miles" && !st.origin)) return tok("--" + s.state.toLowerCase()) || tok("--ink-3");
  const m = metric(s); return m == null ? tok("--r5") : tok("--r" + bucketOf(m));
}

// ---------- filtering ----------
function passesBase(s) {
  if (!st.states.has(s.state)) return false;
  if (!st.past && s.n < TODAYN) return false;
  if (st.age === "aa" && s.age !== "all ages") return false;
  if (st.age === "u21" && s.age === "21+") return false;
  if (st.price !== "") { const p = +st.price; if (p === 0 ? s.priceKind !== "free" : !(s.priceKind === "free" || (s.price != null && s.price <= p))) return false; }
  if (st.maxMi && st.origin) { const m = showMiles(s); if (m == null || m > st.maxMi) return false; }
  if (st.q) { const q = st.q.toLowerCase(); if (!(s.bands.join(" ") + " " + s.venue + " " + s.city).toLowerCase().includes(q)) return false; }
  return true;
}
function inWindow(s) { const d = s.n - dn(st.sel);
  return st.win === "day" ? d === 0 : st.win === "3" ? Math.abs(d) <= 3 : st.win === "week" ? d >= 0 && d <= 6 : true; }
const visible = () => shows.filter(s => passesBase(s) && inWindow(s));

// ---------- map ----------
const map = L.map("map", { zoomControl: true, attributionControl: true, minZoom: 6, maxZoom: 16, zoomSnap: 0.5,
  maxBounds: [[37.5,-82.5],[44.5,-69.5]], preferCanvas: false }).setView([40.45,-74.9], 8);
map.attributionControl.setPrefix(false).addAttribution("Boundaries: US Census via us-atlas · Venues: OpenStreetMap Nominatim");
const TRI = new Set(["34","36","42"]);
const statesLayer = L.geoJSON(BASE.states, { interactive: false, style: f => ({ fillColor: TRI.has(f.properties.id) ? tok("--land") : tok("--land-far"), fillOpacity: 1, color: tok("--border"), weight: 1.4 }) }).addTo(map);
const countyLayer = L.geoJSON(BASE.counties, { interactive: false, style: () => ({ color: tok("--county"), weight: 0.7, fill: false }) }).addTo(map);
statesLayer.bringToBack();
const labelLayer = L.layerGroup().addTo(map);
const ringLayer = L.layerGroup().addTo(map);
const venueLayer = L.layerGroup().addTo(map);
let originMarker = null;
const markers = new Map();

function drawLabels() {
  labelLayer.clearLayers(); const z = map.getZoom();
  for (const c of cityCenters) { if (z < 9 && c.n < 5) continue; if (z < 8 && c.n < 10) continue;
    L.marker([c.lat, c.lng], { interactive: false, keyboard: false,
      icon: L.divIcon({ className: "", html: `<div class="citylab ${c.n >= 10 ? "big" : ""}">${esc(c.label.replace(/, ..$/, ""))}</div>`, iconSize: [0,0], iconAnchor: [-8, 6] }) }).addTo(labelLayer); }
}
map.on("zoomend", drawLabels);

function popupHtml(v, vis) {
  const all = shows.filter(s => s.vkey === v.key && (st.past || s.n >= TODAYN));
  const visIds = new Set(vis.map(s => s.id));
  const approx = v.hidden ? "Address shared by DM; pinned at the city center." : v.precision === "city" ? "Exact spot not found; pinned near the city center." : "";
  const m = st.origin ? miles([st.origin.lat, st.origin.lng], [v.cLat ?? v.lat, v.cLng ?? v.lng]) : null;
  return `<div class="pop"><h4>${esc(v.venue)}</h4><div class="sub">${esc(v.city || "")}${v.city ? ", " : ""}${esc(v.state)}${m != null ? ` · ${m.toFixed(1)} mi from start` : ""}${approx ? `<br><i>${approx}</i>` : ""}</div>
    ${all.map(s => `<div class="ps ${visIds.has(s.id) ? "" : "dim"}"><div><div class="d">${fmtDay(s.date)}${s.start != null ? " · " + fmtTime(s.start) : ""}</div><div>${esc(s.bands.join(", "))}</div></div>
      <button type="button" class="star" data-star="${s.id}" aria-pressed="${st.plan.has(s.id)}">${st.plan.has(s.id) ? "★ In plan" : "☆ Plan"}</button></div>`).join("")}
    <div class="acts"><button type="button" class="btn" data-origin-venue="${esc(v.key)}">Start from here</button>
    <a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.openstreetmap.org/search?query=${encodeURIComponent((v.hidden ? "" : v.venue + ", ") + (v.city || "") + ", " + v.state)}">Look up ↗</a></div></div>`;
}

function drawMap(vis) {
  venueLayer.clearLayers(); markers.clear();
  const byV = new Map(); for (const s of vis) { if (s.v.lat == null) continue; (byV.get(s.vkey) || byV.set(s.vkey, []).get(s.vkey)).push(s); }
  const ink = tok("--ink");
  // draw far/least-relevant first so the hottest markers sit on top
  const entries = [...byV.entries()].map(([k, list]) => { list.sort((a,b) => (metric(a) ?? 1e9) - (metric(b) ?? 1e9) || a.n - b.n); return [k, list]; })
    .sort((a,b) => (metric(b[1][0]) ?? 1e9) - (metric(a[1][0]) ?? 1e9));
  for (const [k, list] of entries) {
    const v = venues.get(k), best = list[0], planned = list.some(s => st.plan.has(s.id));
    const mk = L.circleMarker([v.lat, v.lng], { radius: 6 + 2.2*Math.sqrt(list.length), color: planned ? tok("--accent") : ink,
      weight: planned ? 3.5 : 1.5, dashArray: v.precision === "venue" ? null : "3 3", fillColor: colorOf(best), fillOpacity: 0.92 });
    mk.bindPopup(() => popupHtml(v, list), { maxWidth: 300 });
    mk.bindTooltip(`${esc(v.venue)} · ${list.length} show${list.length > 1 ? "s" : ""}`, { direction: "top", offset: [0, -6] });
    mk.addTo(venueLayer); markers.set(k, mk);
  }
}

function drawOrigin() {
  ringLayer.clearLayers(); if (originMarker) { originMarker.remove(); originMarker = null; }
  if (!st.origin) return;
  originMarker = L.marker([st.origin.lat, st.origin.lng], { icon: L.divIcon({ className: "", html: '<div class="origin-pin" title="Starting point"></div>', iconSize: [22,22], iconAnchor: [11,11] }), zIndexOffset: 1000, keyboard: false })
    .bindTooltip("Start: " + esc(st.origin.label)).addTo(map);
  if (st.colorBy !== "miles") return;
  for (const mi of [5, 15, 30, 60, 100]) {
    L.circle([st.origin.lat, st.origin.lng], { radius: mi*1609.34, color: tok("--ink-3"), weight: 1, dashArray: "2 5", fill: false, interactive: false }).addTo(ringLayer);
    const lat = st.origin.lat + mi/69.0;
    L.marker([lat, st.origin.lng], { interactive: false, keyboard: false, icon: L.divIcon({ className: "", html: `<div class="ringlab">${mi} mi</div>`, iconSize: [0,0], iconAnchor: [10, 6] }) }).addTo(ringLayer);
  }
}

map.on("click", e => { if (!st.picking) return;
  setOrigin({ lat: e.latlng.lat, lng: e.latlng.lng, label: `${e.latlng.lat.toFixed(3)}, ${e.latlng.lng.toFixed(3)}` });
  st.picking = false; $("#pickhint").hidden = true; map.getContainer().style.cursor = ""; });

// ---------- legend ----------
function drawLegend() {
  const L_ = $("#legend");
  if (st.colorBy === "state" || (st.colorBy === "miles" && !st.origin)) {
    L_.innerHTML = `<div class="t">${st.colorBy === "miles" ? "Set a starting point to color by miles · showing state" : "State"}</div><div class="row">${["NJ","NY","PA"].map(s => `<span class="k"><span class="sw" style="background:var(--${s.toLowerCase()})"></span>${s}</span>`).join("")}<span class="k"><span class="sw approx"></span>approx. spot</span></div>`;
    return;
  }
  const b = BUCKETS[st.colorBy];
  L_.innerHTML = `<div class="t">${b.title}${st.colorBy === "days" ? " · " + fmtDay(st.sel) : ""}</div><div class="row">${b.stops.map((s,i) => `<span class="k"><span class="sw" style="background:var(--r${i})"></span>${s[1]}</span>`).join("")}<span class="k"><span class="sw approx"></span>approx. spot</span></div>`;
}

// ---------- calendar ----------
$("#dows").innerHTML = WD.map(d => `<div class="dow">${d.slice(0,2)}</div>`).join("");
function drawCal() {
  const [y, m] = st.month.split("-").map(Number);
  $("#mlabel").textContent = `${MO[m-1]} ${y}`;
  const first = dn(`${st.month}-01`), startDow = new Date(first*864e5).getUTCDay();
  const gridStart = first - startDow, selN = dn(st.sel);
  const base = shows.filter(passesBase);
  const byDay = new Map(); for (const s of base) (byDay.get(s.n) || byDay.set(s.n, []).get(s.n)).push(s);
  let html = "";
  const weeks = Math.ceil((startDow + new Date(Date.UTC(y, m, 0)).getUTCDate()) / 7);
  for (let i = 0; i < weeks*7; i++) {
    const n = gridStart + i, iso = isoOf(n), list = byDay.get(n) || [];
    const fake = { n, state: "NJ" }; // for in-window test only
    const inWin = (st.win === "day" ? n === selN : st.win === "3" ? Math.abs(n - selN) <= 3 : st.win === "week" ? n >= selN && n <= selN + 6 : true);
    const cls = ["day", iso.slice(0,7) !== st.month ? "out" : "", n === TODAYN ? "today" : "", n === selN ? "sel" : "", n < TODAYN ? "past" : "", inWin && st.win !== "all" ? "inwin" : ""].join(" ");
    const sorted = list.slice().sort((a,b) => (metric(a) ?? 1e9) - (metric(b) ?? 1e9));
    const dots = sorted.slice(0, 12).map(s => `<i style="background:${colorOf(s)}"></i>`).join("");
    html += `<button type="button" class="${cls}" data-day="${iso}" aria-label="${fmtDay(iso)}, ${list.length} show${list.length === 1 ? "" : "s"}" aria-pressed="${n === selN}"><span class="n"><span>${Number(iso.slice(8))}</span>${list.length ? `<b>${list.length}</b>` : ""}</span><span class="dots">${dots}</span></button>`;
  }
  $("#days").innerHTML = html;
  const vis = visible().length;
  $("#selinfo").innerHTML = `<b>${fmtDay(st.sel)}</b>${st.sel === TODAY ? " (today)" : ""} · ${vis} show${vis === 1 ? "" : "s"} in view`;
}

// ---------- list ----------
function rowHtml(s, opts = {}) {
  const m = showMiles(s);
  const price = s.priceKind === "free" ? `<span class="tag free">free</span>` : s.door && s.door !== "-" ? `<span class="mono">${esc(s.door)}</span>` : "";
  const age = s.age === "all ages" ? `<span class="tag aa">all ages</span>` : s.age !== "unknown" ? `<span class="tag">${esc(s.age)}</span>` : "";
  const approx = s.v.hidden ? " · address by DM" : s.v.precision !== "venue" ? " · approx." : "";
  return `<div class="show"><span class="sw ${s.v.precision === "venue" ? "" : ""}" style="background:${colorOf(s)}"></span>
    <div style="min-width:0"><div class="bands" data-fly="${esc(s.vkey)}" role="button" tabindex="0">${esc(s.bands.join(" · ") || "TBA")}</div>
      <div class="meta"><span>${esc(s.venue)}, ${esc(s.city || s.state)}${s.city ? " " + esc(s.state) : ""}${approx}</span>${opts.date ? `<span class="mono">${fmtDay(s.date)}</span>` : ""}${s.time ? `<span class="mono">${esc(s.time)}</span>` : ""}${price}${age}${m != null ? `<span class="mono">${m.toFixed(1)} mi</span>` : ""}</div>
      <div class="links">${s.flier ? `<a href="${esc(s.flier)}" target="_blank" rel="noopener">Flier ↗</a>` : ""}${s.link ? `<a href="${esc(s.link)}" target="_blank" rel="noopener">Link ↗</a>` : ""}</div></div>
    <button type="button" class="star" data-star="${s.id}" aria-pressed="${st.plan.has(s.id)}">${st.plan.has(s.id) ? "★ In plan" : "☆ Plan"}</button></div>`;
}
function drawList(vis) {
  const pane = $("#pane-list");
  $("#c-list").textContent = vis.length;
  if (!vis.length) {
    const any = shows.filter(passesBase);
    const next = any.find(s => s.n > dn(st.sel));
    pane.innerHTML = `<div class="empty"><b>No shows match in this window.</b><br>${next ? `Next match: <a href="#" data-jump="${next.date}">${fmtDay(next.date)}</a>. ` : ""}Widen the window, loosen a filter, or turn on past shows.</div>`;
    return;
  }
  const sel = dn(st.sel), groups = new Map();
  const sorted = vis.slice().sort((a,b) => a.n - b.n || (st.colorBy === "miles" ? (showMiles(a) ?? 1e9) - (showMiles(b) ?? 1e9) : (a.start ?? 0) - (b.start ?? 0)));
  for (const s of sorted) (groups.get(s.date) || groups.set(s.date, []).get(s.date)).push(s);
  pane.innerHTML = [...groups.entries()].map(([d, list]) => { const off = dn(d) - sel;
    const rel = off === 0 ? "selected day" : off > 0 ? `+${off} day${off > 1 ? "s" : ""}` : `${off} day${off < -1 ? "s" : ""}`;
    return `<div class="dgroup"><div class="dhead"><h3>${fmtDay(d)}</h3><span class="rel">${rel} · ${list.length}</span></div>${list.map(s => rowHtml(s)).join("")}</div>`; }).join("");
}

// ---------- plan ----------
function planShows() { return [...st.plan].map(id => showById.get(id)).filter(Boolean).sort((a,b) => a.n - b.n || (a.start ?? 0) - (b.start ?? 0)); }
function drawPlan() {
  const list = planShows(), pane = $("#pane-plan");
  $("#c-plan").textContent = list.length || "";
  if (!list.length) { pane.innerHTML = `<div class="empty"><b>Your plan is empty.</b><br>Tap ☆ Plan on any show, in the list or a map popup. Picks stay in this browser.</div>`; return; }
  let total = 0, html = "", prev = null;
  if (st.origin && list[0].v.lat != null) { const m = miles([st.origin.lat, st.origin.lng], [list[0].v.cLat ?? list[0].v.lat, list[0].v.cLng ?? list[0].v.lng]); total += m;
    html += `<div class="leg">from ${esc(st.origin.label)} → ${m.toFixed(1)} mi</div>`; }
  for (const s of list) {
    if (prev && prev.v.lat != null && s.v.lat != null) {
      const m = miles([prev.v.cLat ?? prev.v.lat, prev.v.cLng ?? prev.v.lng], [s.v.cLat ?? s.v.lat, s.v.cLng ?? s.v.lng]); total += m;
      const same = prev.n === s.n, gap = s.n - prev.n;
      html += `<div class="leg">${same ? `<span class="${m > 15 ? "warn" : ""}">same night${m > 15 ? ", far apart" : ""}</span> · ` : gap > 1 ? `${gap} days later · ` : "next day · "}${m.toFixed(1)} mi${prev.v.precision !== "venue" || s.v.precision !== "venue" ? " (approx.)" : ""}</div>`;
    }
    html += rowHtml(s, { date: true }); prev = s;
  }
  pane.innerHTML = `<div class="plansum"><span class="tot">${list.length} show${list.length > 1 ? "s" : ""} · ${fmtDay(list[0].date)} → ${fmtDay(list.at(-1).date)} · ~${total.toFixed(0)} mi hopping</span>
    <button type="button" class="btn" id="copyPlan">Copy as text</button><button type="button" class="btn" id="csvPlan" hidden>Save CSV</button><button type="button" class="btn" id="mapPlan">Fit on map</button><button type="button" class="btn" id="clearPlan">Clear</button></div>
    <div id="clearConfirm" class="empty" hidden>Remove all ${list.length} shows from your plan? <button type="button" class="btn hot" id="clearYes">Remove</button> <button type="button" class="btn" id="clearNo">Keep</button></div>${html}`;
  if (downloads || !inClaude) $("#csvPlan").hidden = false;
}
function planText() { return planShows().map(s => `${fmtDay(s.date)}${s.time ? " (" + s.time + ")" : ""} — ${s.bands.join(", ")} @ ${s.venue}, ${s.city || ""} ${s.state}${s.door && s.door !== "-" ? " · " + s.door : ""}${s.age !== "unknown" ? " · " + s.age : ""}${s.link ? " · " + s.link : ""}`).join("\n") + "\n\nvia coolshows.life"; }
function planCsv() { const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  return ["date,time,bands,venue,city,state,door,age,flier,link", ...planShows().map(s => [s.date, s.time, s.bands.join(", "), s.venue, s.city, s.state, s.door, s.ageRaw, s.flier, s.link].map(q).join(","))].join("\n"); }

// ---------- render ----------
function render() {
  const vis = visible();
  drawCal(); drawList(vis); drawPlan(); drawMap(vis); drawOrigin(); drawLegend();
  $("#stat").textContent = `${shows.filter(s => s.n >= TODAYN).length} upcoming · ${new Set(shows.map(s => s.vkey)).size} venues`;
  store.set("plan", [...st.plan]); store.set("origin", st.origin);
}
function restyleBase() { statesLayer.setStyle(f => ({ fillColor: TRI.has(f.properties.id) ? tok("--land") : tok("--land-far"), color: tok("--border") })); countyLayer.setStyle({ color: tok("--county") }); }

// ---------- controls ----------
function seg(id, key) { const el = $(id); el.addEventListener("click", e => { const b = e.target.closest("button[data-v]"); if (!b) return;
  st[key] = b.dataset.v; el.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); if (key === "colorBy" && st[key] === "miles" && !st.origin) toast("Pick a starting point to color by miles"); render(); }); }
seg("#colorBy", "colorBy"); seg("#win", "win");
function syncSeg() { for (const [id, key] of [["#colorBy","colorBy"],["#win","win"]]) $(id).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x.dataset.v === st[key])); }

const oSel = $("#origin");
function buildOrigins() { oSel.innerHTML = `<option value="">— none —</option>` + cityCenters.map((c, i) => `<option value="${i}">${esc(c.label)}</option>`).join("") + `<option value="custom" hidden>Custom point</option>`; }
buildOrigins();
function syncOrigin() { if (!st.origin) { oSel.value = ""; return; } const i = cityCenters.findIndex(c => c.label === st.origin.label); oSel.value = i >= 0 ? String(i) : "custom";
  oSel.querySelector('option[value="custom"]').hidden = i >= 0; oSel.querySelector('option[value="custom"]').textContent = i >= 0 ? "Custom point" : st.origin.label; }
function setOrigin(o) { st.origin = o; if (o && st.colorBy !== "miles") { st.colorBy = "miles"; syncSeg(); } syncOrigin(); render(); }
oSel.addEventListener("change", () => { const v = oSel.value; if (v === "") { st.origin = null; st.maxMi = null; $("#maxmi").value = ""; syncOrigin(); render(); return; }
  if (v === "custom") return; const c = cityCenters[+v]; setOrigin({ lat: c.lat, lng: c.lng, label: c.label }); });
$("#pick").addEventListener("click", () => { st.picking = !st.picking; $("#pickhint").hidden = !st.picking; map.getContainer().style.cursor = st.picking ? "crosshair" : ""; });
$("#maxmi").addEventListener("change", e => { st.maxMi = e.target.value ? +e.target.value : null; if (st.maxMi && !st.origin) toast("Distance filter needs a starting point"); render(); });
$("#age").addEventListener("change", e => { st.age = e.target.value; render(); });
$("#price").addEventListener("change", e => { st.price = e.target.value; render(); });
$("#states").addEventListener("change", e => { if (e.target.id === "past") st.past = e.target.checked; else e.target.checked ? st.states.add(e.target.value) : st.states.delete(e.target.value); render(); });
let qT; $("#q").addEventListener("input", e => { clearTimeout(qT); qT = setTimeout(() => { st.q = e.target.value.trim(); render(); }, 150); });
$("#prevM").addEventListener("click", () => { const [y,m] = st.month.split("-").map(Number); const d = new Date(Date.UTC(y, m-2, 1)); st.month = d.toISOString().slice(0,7); drawCal(); });
$("#nextM").addEventListener("click", () => { const [y,m] = st.month.split("-").map(Number); const d = new Date(Date.UTC(y, m, 1)); st.month = d.toISOString().slice(0,7); drawCal(); });
$("#goToday").addEventListener("click", () => { st.sel = TODAY; st.month = TODAY.slice(0,7); render(); });
$("#days").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (!b) return; selectDay(b.dataset.day); });
function selectDay(iso) { st.sel = iso; st.month = iso.slice(0,7); if (dn(iso) < TODAYN && !st.past) { st.past = true; $("#past").checked = true; } render(); }
function tab(which) { st.tab = which; $("#tab-list").setAttribute("aria-selected", which === "list"); $("#tab-plan").setAttribute("aria-selected", which === "plan");
  $("#pane-list").hidden = which !== "list"; $("#pane-plan").hidden = which !== "plan"; }
$("#tab-list").addEventListener("click", () => tab("list")); $("#tab-plan").addEventListener("click", () => tab("plan"));

function fly(vkey) { const v = venues.get(vkey); if (!v || v.lat == null) return; map.flyTo([v.lat, v.lng], Math.max(map.getZoom(), 13), { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 0.6 });
  const mk = markers.get(vkey); if (mk) setTimeout(() => mk.openPopup(), 650); if (innerWidth <= 900) document.querySelector(".mapwrap").scrollIntoView({ block: "start" }); }

document.addEventListener("click", async e => {
  const star = e.target.closest("[data-star]");
  if (star) { const id = star.dataset.star; st.plan.has(id) ? st.plan.delete(id) : st.plan.add(id);
    const on = st.plan.has(id); document.querySelectorAll(`[data-star="${id}"]`).forEach(b => { b.setAttribute("aria-pressed", on); b.textContent = on ? "★ In plan" : "☆ Plan"; });
    store.set("plan", [...st.plan]); drawPlan(); const vis = visible(); drawMap(vis); toast(on ? "Added to plan" : "Removed from plan"); return; }
  const f = e.target.closest("[data-fly]"); if (f) { fly(f.dataset.fly); return; }
  const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); selectDay(j.dataset.jump); return; }
  const ov = e.target.closest("[data-origin-venue]"); if (ov) { const v = venues.get(ov.dataset.originVenue); setOrigin({ lat: v.cLat ?? v.lat, lng: v.cLng ?? v.lng, label: `${v.venue}, ${v.city || v.state}` }); map.closePopup(); return; }
  if (e.target.id === "copyPlan") { const txt = planText(); try { await navigator.clipboard.writeText(txt); toast("Plan copied"); } catch { const ta = document.createElement("textarea"); ta.value = txt; ta.style.width = "100%"; ta.rows = 6; $("#pane-plan").prepend(ta); ta.select(); toast("Select and copy the text above"); } return; }
  if (e.target.id === "csvPlan") {
    if (downloads) { try { await downloads.save({ filename: "coolshows-plan.csv", data: planCsv() }); toast("Saved"); } catch (err) { if (err?.code !== "declined") toast("Couldn't save the file here"); } return; }
    if (!inClaude) { const url = URL.createObjectURL(new Blob([planCsv()], { type: "text/csv" })); const a = Object.assign(document.createElement("a"), { href: url, download: "coolshows-plan.csv" });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
    return; }
  if (e.target.id === "mapPlan") { const pts = planShows().filter(s => s.v.lat != null).map(s => [s.v.lat, s.v.lng]); if (st.origin) pts.push([st.origin.lat, st.origin.lng]); if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 }); if (innerWidth <= 900) document.querySelector(".mapwrap").scrollIntoView({ block: "start" }); return; }
  if (e.target.id === "clearPlan") { $("#clearConfirm").hidden = false; return; }
  if (e.target.id === "clearNo") { $("#clearConfirm").hidden = true; return; }
  if (e.target.id === "clearYes") { st.plan.clear(); render(); toast("Plan cleared"); return; }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-fly]")) { e.preventDefault(); fly(e.target.dataset.fly); } });

// theme changes: Leaflet paints with literal colors, so repaint from tokens
const rethink = () => { restyleBase(); render(); };
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", rethink);
new MutationObserver(rethink).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });


// ---------- live refresh ----------
// On a normal site the page reads the coolshows sheet itself on every visit, using the same
// cleanup rules as tools/scrape.py. Claude's viewer blocks outside requests, so there the
// built-in snapshot stays. Exact venue spots for brand-new venues come from the repo's
// scheduled GitHub Action; until then they sit at their city center.
const SHEET = "https://opensheet.elk.sh/1vkGXNAsJAb4BDYOHGgpi-HAydM7RVgssoBZfFsH0ark/current";
const CITY_ALIASES = { nb: "New Brunswick", philly: "Philadelphia", phila: "Philadelphia", jc: "Jersey City", bk: "Brooklyn", "-": "", "": "" };
const VENUE_ALIASES = { "gold soudns": "Gold Sounds", "cousin dannys": "Cousin Danny's", "barge inn": "The Barge" };
const HIDDEN = /dm for|figure it out|ask a punk|tba|secret/i;
const STATE_NAMES = { NJ: "New Jersey", NY: "New York", PA: "Pennsylvania" };
const clean = v => String(v ?? "").trim().replace(/\s+/g, " ");
const asInt = v => /^\s*[+-]?\d+\s*$/.test(String(v ?? "")) ? parseInt(v, 10) : null;
function inferYear(month, today) { let y = today.getFullYear(); const tm = today.getMonth() + 1;
  if (month < tm - 2) y += 1; else if (month > tm + 2) y -= 1; return y; }
function parsePrice(raw) { const s = String(raw ?? "").toLowerCase();
  if (!s || ["-", "?", "tba"].includes(s)) return [null, "unknown"];
  if (s.includes("free")) return [0, "free"];
  const nums = [...s.matchAll(/\$?\s*(\d+(?:\.\d+)?)/g)].map(m => +m[1]);
  if (nums.length) return [Math.min(...nums), "paid"];
  if (/donat|pwyc|sliding/.test(s)) return [null, "donation"];
  return [null, "unknown"]; }
function parseAge(raw) { const s = String(raw ?? "").toLowerCase();
  return s.includes("21") ? "21+" : s.includes("18") ? "18+" : s.includes("all") ? "all ages" : "unknown"; }
function parseStart(raw) { const s = String(raw ?? "").toLowerCase().replace(/\$\s*\d+/g, "");
  const times = [...s.matchAll(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/g)]; if (!times.length) return null;
  const m = s.match(/(music|show|bands?)\D{0,6}(\d{1,2})(?::(\d{2}))?/);
  let h, mm; if (m) { h = +m[2]; mm = +(m[3] || 0); } else { h = +times[0][1]; mm = +(times[0][2] || 0); }
  if (h >= 1 && h <= 11 && !/\d\s*am\b/.test(s)) h += 12; return h*60 + mm; }
async function sha10(str) { const b = await crypto.subtle.digest("SHA-1", new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("").slice(0, 10); }

async function normalizeRow(r, today) {
  const m = asInt(r.month), d = asInt(r.day); if (m == null || d == null) return null;
  const state = clean(r.state).toUpperCase(), cityRaw = clean(r.city);
  let city = CITY_ALIASES[cityRaw.toLowerCase()] ?? cityRaw;
  if (!city && state === "NY") city = String(r.venue ?? "").toLowerCase().includes("night club 101") ? "Manhattan" : "New York City";
  const venueRaw = clean(r.venue), venue = VENUE_ALIASES[venueRaw.toLowerCase()] ?? venueRaw, hidden = HIDDEN.test(venue);
  const y = inferYear(m, today), [price, priceKind] = parsePrice(r.door);
  const vkey = `${state}|${city.toLowerCase()}|${hidden ? "~hidden" : venue.toLowerCase()}`;
  return { venue: { key: vkey, state, city, venue: hidden ? "Address by DM" : venue, hidden },
    show: { id: "s" + await sha10(`${y}-${m}-${d}|${vkey}|${r.bands ?? ""}`),
      date: `${y}-${String(m).padStart(2, "0")}-${String(d).padStart(2, "0")}`,
      bands: String(r.bands ?? "").split(/,|\s\/\s|\n/).map(b => b.trim()).filter(Boolean),
      venue: hidden ? "Address by DM" : venue, city, state, vkey, time: clean(r.time), start: parseStart(r.time),
      door: clean(r.door), price, priceKind, age: parseAge(r.accessability), ageRaw: clean(r.accessability),
      flier: clean(r.flier), link: clean(r.IG) } };
}

async function cityCenter(city, state) {
  const label = `${city}, ${state}`.toLowerCase();
  const known = cityCenters.find(c => c.label.toLowerCase() === label); if (known) return [known.lat, known.lng];
  const cache = store.get("geo", {}); if (label in cache) return cache[label];
  if (!city || (cityCenter.calls = (cityCenter.calls || 0) + 1) > 4) return null; // stay light on the free geocoder
  await new Promise(r => setTimeout(r, 1100));
  try { const q = new URLSearchParams({ q: `${city}, ${STATE_NAMES[state] || state}`, format: "json", limit: "1", countrycodes: "us", viewbox: "-80.6,42.6,-71.8,38.8", bounded: "1" });
    const res = await (await fetch("https://nominatim.openstreetmap.org/search?" + q)).json();
    const hit = res?.[0] ? [+res[0].lat, +res[0].lon] : null; cache[label] = hit; store.set("geo", cache); return hit; } catch { return null; }
}

async function liveRefresh() {
  if (inClaude || !window.crypto?.subtle) return;
  let rows; try { const r = await fetch(SHEET, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); rows = await r.json(); } catch { return; }
  if (!Array.isArray(rows) || !rows.length) return;
  const today = new Date(), live = [], fresh = new Map();
  for (const r of rows) { const n = await normalizeRow(r, today); if (!n) continue; live.push(n.show); if (!fresh.has(n.venue.key)) fresh.set(n.venue.key, n.venue); }
  const ids = new Set(live.map(s => s.id));
  const kept = DATA.shows.filter(s => !ids.has(s.id) && s.date < TODAY); // past shows the live calendar has dropped
  const known = new Set(DATA.venues.map(v => v.key)), added = [];
  for (const v of fresh.values()) { if (known.has(v.key)) continue;
    const c = await cityCenter(v.city, v.state);
    added.push({ ...v, lat: c ? c[0] : null, lng: c ? c[1] : null, precision: c ? "city" : "none", match: "" }); }
  DATA = { ...DATA, shows: [...live, ...kept].sort((a, b) => a.date.localeCompare(b.date) || (a.start ?? 0) - (b.start ?? 0)), venues: [...DATA.venues, ...added] };
  prep(DATA); buildOrigins(); syncOrigin(); drawLabels(); render();
  const t = new Date(); $("#scraped").textContent = `Live listings, checked ${fmtTime(t.getHours()*60 + t.getMinutes())}`;
}

let downloads = null;
// Inside Claude's viewer, saves go through its download prompt; on a normal site (GitHub Pages) a plain browser download works.
const inClaude = typeof window.claude?.use === "function";
$("#scraped").textContent = "Listings as of " + fmtDay(DATA.scraped) + ", " + DATA.scraped.slice(0,4);
syncOrigin(); drawLabels(); render();
if (st.plan.size) tab("list");
liveRefresh();
window.claude?.use?.("downloads").then(d => { downloads = d; if (d) drawPlan(); }).catch(() => {});
</script>
